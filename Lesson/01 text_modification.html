    <html>
        <head>
            <title>module01: h1, h2, p, em, div</title>
        </head>

        <body>
            <h1>Music Band</h1>
            <hr>

            <h2>About the Band</h2>

            <div>
                <!--em (emphasis) b (bold)-->
                <p> Rediscovering music, <em> One album at a time</em></p>
                <p> Est <b> 2026</b></p>

                <!-- small (small text) and i (italic)-->
                 <p></small><i> Find our Merch at merch ebay.com</i> </p>

                 <hr>     

            </div>

            <div>
                <!-- Sub (Subscript), Sup (Superscript), li-->
                 <h3> Discover</h3>
                 <li>H <sub>2</sub>0</li>
                 <li>E is MC<sup>2</sup>0</li>

                 <h4>Lyrics H<sub>2</sub>0</h4>
                <i>
                    Oh simple thing, where have you gone <br>
                    Am getting tired and i need something to rely on
                 
                </i>
            </div>
        </body>
    </html>
